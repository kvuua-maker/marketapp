name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + live sync smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      MAX_PRODUCTS_PER_SYNC: "30"
      SYNC_PAGE_SIZE: "15"
      SYNC_INTERVAL_MINUTES: "600"
      PORT: "8787"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Live sync from Aveopt (public Store API)
        run: npm run sync

      - name: API smoke test
        run: |
          node --no-warnings src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8787/v1/health" > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS "http://127.0.0.1:8787/v1/categories"
          curl -fsS "http://127.0.0.1:8787/v1/products?limit=5" | head -c 600
          kill $SERVER_PID

  ios:
    name: iOS build (SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MarketApp.xcodeproj \
            -scheme MarketApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/xcodebuild.log | tail -n 40

  testflight:
    name: TestFlight upload (optional)
    needs: [backend, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      APPLE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      HAS_APPLE: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip notice
        if: env.HAS_APPLE != 'true'
        run: |
          echo "::notice title=TestFlight skipped::Apple credentials are not configured."
          echo "Add APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY (p8), APPLE_TEAM_ID to enable uploads."

      - name: Install XcodeGen
        if: env.HAS_APPLE == 'true'
        run: brew install xcodegen

      - name: Install signing assets
        if: env.HAS_APPLE == 'true'
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY" > ~/private_keys/AuthKey.p8
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive
        if: env.HAS_APPLE == 'true'
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild \
            -project MarketApp.xcodeproj \
            -scheme MarketApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MarketApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            archive

      - name: Export IPA
        if: env.HAS_APPLE == 'true'
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MarketApp.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"

      - name: Upload to TestFlight
        if: env.HAS_APPLE == 'true'
        working-directory: ios
        run: |
          IPA=$(find build/export -name '*.ipa' | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_KEY_ID" \
            --apiIssuer "$APPLE_ISSUER_ID"
