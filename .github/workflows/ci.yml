name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + live sync smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      MAX_PRODUCTS_PER_SYNC: "30"
      SYNC_PAGE_SIZE: "15"
      SYNC_INTERVAL_MINUTES: "600"
      PORT: "8787"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: npm test

      - name: Live sync from Aveopt (public Store API)
        run: npm run sync

      - name: API smoke test
        run: |
          node --no-warnings src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8787/v1/health" > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS "http://127.0.0.1:8787/v1/categories"
          curl -fsS "http://127.0.0.1:8787/v1/products?limit=5" | head -c 600
          kill $SERVER_PID

  ios:
    name: iOS build (SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project MarketApp.xcodeproj \
            -scheme MarketApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/xcodebuild.log | tail -n 40
